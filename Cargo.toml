[workspace]
resolver = "2"
members = [
    "crates/rockusb",
    "crates/jb-core",
    "crates/jb-cli",
    "crates/win-drv",
]

[workspace.package]
version = "0.1.5"
edition = "2021"
license = "MIT"
repository = "https://github.com/LibreCapsula/capsula-userspace-jailbreak"

[workspace.dependencies]
# internal
rockusb = { path = "crates/rockusb" }
jb-core = { path = "crates/jb-core" }
win-drv = { path = "crates/win-drv" }

# usb / protocol
nusb = "0.2"

# errors / misc
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"

# formats / data
serde = { version = "1", features = ["derive"] }
toml = "1"
sha2 = "0.11"
crc32fast = "1"
hex = "0.4"

# userdata overlay: ext2/3/4 via lwext4 (compiled with cc, no runtime deps)
ext4-lwext4 = "0.1"
cc = "1"

# cli / progress / gui
clap = { version = "4", features = ["derive"] }
indicatif = "0.18"

[profile.release]
lto = "thin"
strip = "symbols"
