[package]
name = "jb-cli"
description = "capsula-jb — the VK Capsula userspace-jailbreak CLI: backup/userdata-overlay/monitor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "capsula-jb"
path = "src/main.rs"

[dependencies]
jb-core = { workspace = true }
rockusb = { workspace = true }
amlogic = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
clap = { workspace = true }
indicatif = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
# WinUSB driver management (Zadig-generated packages); no-op stubs on
# non-Windows, so it is an unconditional dependency
win-drv = { workspace = true }

[build-dependencies]
# embeds capsula-jb.manifest (requireAdministrator) into the exe
embed-resource = "3"
